<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Vissenlijst</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161e22" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f5f7f8; --paneel:#fff; --rand:#e2e8eb; --inkt:#142329; --zacht:#62767e;
  --accent:#0b7285; --accent-zacht:#e6f4f6; --op-accent:#fff; --uit:#b3261e;
  --gd:#d8611f; --gd-tekst:#a8480f; --avw:#1c8fa6; --avw-tekst:#0f6b7e; --tint:6%;
  --schaduw:0 1px 2px rgba(20,35,41,.05);
  --hoog:0 10px 28px rgba(20,35,41,.14);
  --kaart:210px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1417; --paneel:#161e22; --rand:#273237; --inkt:#e7eef0; --zacht:#8fa3aa;
  --accent:#4cc3d6; --accent-zacht:#163138; --op-accent:#06262c; --uit:#ff8a80;
  --gd:#f08a4b; --gd-tekst:#f5a877; --avw:#3fb6cc; --avw-tekst:#7fd3e2; --tint:9%;
  --schaduw:0 1px 2px rgba(0,0,0,.35);
  --hoog:0 10px 28px rgba(0,0,0,.45);
}}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--inkt);font:15px/1.45 system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.breed{max-width:1700px;margin:auto;padding-left:24px;padding-right:24px}
.ic{flex:none;vertical-align:-.2em}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- kop ---------- */
header{background:var(--paneel);border-bottom:1px solid var(--rand)}
.kop{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding-top:14px;padding-bottom:14px}
.merknaam{display:flex;align-items:center;gap:12px;margin-right:auto}
.logo-vis{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--op-accent)}
h1{margin:0;font-size:21px;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--zacht);margin:2px 0 0;font-size:13px}
.winkels{display:flex;gap:4px;padding:4px;background:var(--bg);border:1px solid var(--rand);border-radius:14px}
.winkels button{font:inherit;font-size:13px;color:var(--zacht);cursor:pointer;border:1px solid transparent;border-radius:10px;background:none;
  height:42px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px 0 6px;transition:background .15s,color .15s}
.winkels button.alle{padding-left:12px}
.winkels button:hover{color:var(--inkt)}
.winkels button b{color:var(--inkt);font-variant-numeric:tabular-nums}
.winkels button[aria-pressed=true]{background:var(--paneel);border-color:var(--rand);box-shadow:var(--schaduw);color:var(--inkt)}
.winkels button.gd[aria-pressed=true]{border-color:var(--gd)}
.winkels button.avw[aria-pressed=true]{border-color:var(--avw)}
#logo-gd,#logo-avw{display:flex;align-items:center;justify-content:center;height:30px;border-radius:7px;padding:0 6px;overflow:hidden}
#logo-gd{background:#fff;color:#142329}
#logo-avw{background:#0d3440;color:#fff}
#logo-avw img{height:17px;max-width:100%;display:block}
.gdlogo{display:block;height:28px;aspect-ratio:590/260;flex:none;overflow:hidden;position:relative}   /* flex:none: de uitsnede klopt alleen bij deze verhouding */
.gdlogo img{position:absolute;width:242.5%;left:-14.4%;top:-9.6%;max-width:none}
.meldknop{font:inherit;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  border:1px solid var(--rand);border-radius:12px;background:var(--paneel);color:var(--inkt);height:42px;padding:0 14px 0 11px}
.meldknop:hover{border-color:var(--accent);color:var(--accent)}
.meldknop.aan{background:var(--accent-zacht);border-color:transparent;color:var(--accent)}
.meldknop:disabled{opacity:.6;cursor:progress}
.meldhint{margin:0 0 12px;font-size:13px;background:var(--accent-zacht);border-radius:10px;padding:9px 13px;max-width:640px}

/* ---------- wijzigingen ---------- */
.nieuws{margin-top:16px}
.nieuws>details{background:var(--paneel);border:1px solid var(--rand);border-radius:14px;padding:10px 16px}
.nieuws>details>summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.nieuws summary b{font-weight:650}
.nieuws summary small{color:var(--zacht);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--k) 14%,transparent);color:color-mix(in srgb,var(--k) 72%,var(--inkt))}
.nieuws h3{font-size:13px;margin:14px 0 8px;display:flex;align-items:center;gap:6px}
.strook{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.mini{--w:var(--avw);flex:none;width:136px;border:1px solid color-mix(in srgb,var(--w) 24%,var(--rand));border-radius:12px;overflow:hidden;
  background:color-mix(in srgb,var(--w) var(--tint),var(--paneel));color:inherit;font:inherit;font-size:12px;text-align:left;padding:0;cursor:pointer;text-decoration:none;display:block}
.mini.gd{--w:var(--gd)}
.mini:hover{border-color:var(--w)}
.mini img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--rand)}
.mini span{display:block;padding:6px 8px 0;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.mini small{display:block;padding:2px 8px 7px;color:var(--zacht)}
.mini.weg img{filter:grayscale(1);opacity:.6}
.ouder{margin-top:10px;border-top:1px solid var(--rand);padding-top:8px}
.ouder summary{cursor:pointer;color:var(--zacht);font-size:13px}
summary{list-style:none}summary::-webkit-details-marker{display:none}
summary>.ic{transition:rotate .15s;color:var(--zacht)}
details[open]>summary>.ic:first-child{rotate:90deg}

/* ---------- zoekbalk en filters ---------- */
.balk{position:sticky;top:0;z-index:5;margin-top:8px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.balk-in{padding-top:10px;padding-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],input[type=number],select{font:inherit;color:inherit;background:var(--paneel);border:1px solid var(--rand);border-radius:12px;height:42px;padding:0 12px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
select{cursor:pointer}
.zoekveld{flex:1 1 260px;min-width:180px;position:relative;display:flex}
.zoekveld .ic{position:absolute;left:13px;top:50%;translate:0 -50%;color:var(--zacht);pointer-events:none}
.zoekveld input{flex:1;min-width:0;padding-left:40px}
.seg{display:inline-flex;gap:2px;height:42px;padding:3px;border:1px solid var(--rand);border-radius:12px;background:var(--paneel)}
.seg button{font:inherit;font-size:14px;color:var(--zacht);background:none;border:0;border-radius:9px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg button:hover{color:var(--inkt)}
.seg button[aria-pressed=true]{background:var(--accent-zacht);color:var(--accent);font-weight:600}
.seg button#richting{color:var(--inkt);background:none;font-weight:400}
.seg small{opacity:.75}
.knopje{font:inherit;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;border:1px solid var(--rand);border-radius:12px;background:var(--paneel);color:var(--inkt);padding:0 14px;cursor:pointer}
.knopje:hover{border-color:var(--accent)}
.knopje.actief,.knopje[aria-expanded=true]{border-color:var(--accent);color:var(--accent)}
.knopje b{background:var(--accent);color:var(--op-accent);border-radius:999px;font-size:11px;padding:0 6px}
.knopje.klein{height:32px;border-radius:999px;padding:0 12px;font-size:13px;gap:5px;color:var(--zacht)}
.opties{display:contents}
.uitgebreid{display:none}
.uitgebreid.open{display:block}
.uitgebreid>div{padding-bottom:12px}
.paneelfilters{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;background:var(--paneel);border:1px solid var(--rand);border-radius:14px;padding:14px 16px;box-shadow:var(--schaduw)}
.uitgebreid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--zacht)}
.uitgebreid input[type=number]{width:120px}
.uitgebreid input[type=number],.uitgebreid select{background:var(--bg)}
.vinkjes{flex-basis:100%;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;border-top:1px solid var(--rand);padding-top:12px}
.uitgebreid label.vink{flex-direction:row;align-items:center;gap:7px;font-size:14px;color:var(--inkt);cursor:pointer;white-space:nowrap}
label.vink input{accent-color:var(--accent)}
.vinkjes .knopje{margin-left:auto}

/* ---------- soorten ---------- */
.soorten{display:flex;align-items:flex-start;gap:8px;padding-top:4px}
.chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)}
.chips::-webkit-scrollbar{display:none}
.soorten.open .chips{flex-wrap:wrap;overflow:visible;-webkit-mask-image:none;mask-image:none}
.chip{flex:none;font:inherit;font-size:13px;height:32px;border:1px solid var(--rand);background:var(--paneel);color:var(--inkt);border-radius:999px;padding:0 13px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip small{color:var(--zacht);margin-left:6px}
.chip.nul{opacity:.5}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--op-accent);opacity:1}
.chip[aria-pressed=true] small{color:inherit;opacity:.8}
#soortmeer{flex:none;margin-top:2px}

/* ---------- lijst ---------- */
main{padding-top:16px;padding-bottom:60px}
.teller{color:var(--zacht);font-size:13px;margin:0 0 6px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;min-height:32px}
.teller b{color:var(--inkt)}
.legenda{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:9px;height:9px;border-radius:50%;display:inline-block}
.legenda .gd{background:var(--gd)}.legenda .avw{background:var(--avw)}
.groepknoppen{margin-left:auto;display:inline-flex;gap:6px}
details.groep{margin-bottom:22px}
details.groep>summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;letter-spacing:-.01em;padding:8px 0 12px}
details.groep>summary small{font-weight:600;color:var(--zacht);font-size:13px}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(var(--kaart),46vw),1fr));gap:16px}
.kaart{--w:var(--avw);background:color-mix(in srgb,var(--w) var(--tint),var(--paneel));border:1px solid color-mix(in srgb,var(--w) 20%,var(--rand));border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;font:inherit;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s}
.kaart.gd{--w:var(--gd)}
.kaart:hover,.kaart:focus-visible{outline:none;transform:translateY(-3px);box-shadow:var(--hoog);border-color:var(--w)}
.foto{aspect-ratio:4/3;background:var(--rand);position:relative;overflow:hidden}
.foto img.vis{width:100%;height:100%;object-fit:cover;display:block;transition:scale .3s}
.kaart:hover .foto img.vis{scale:1.04}
.kaart.op-is .foto img.vis{filter:grayscale(.75);opacity:.7}
.foto .geen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--zacht);font-size:13px}
.merk{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.3);overflow:hidden;font-size:10px;font-weight:700;color:#222}
.merk img{width:22px;height:22px;object-fit:contain;display:block}
.merk.ander{left:29px;top:12px;width:20px;height:20px;z-index:0;opacity:.92}
.merk.ander img{width:15px;height:15px}
.merk:not(.ander){z-index:1}
.op{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:650;padding:3px 9px;border-radius:999px;background:rgba(150,28,22,.92);color:#fff}
.info{padding:11px 13px 12px;display:flex;flex-direction:column;gap:1px;flex:1}
.naam{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.lat{font-style:italic;color:var(--zacht);font-size:13px;overflow-wrap:anywhere}
.regel{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:auto;padding-top:10px;font-size:13px;color:var(--zacht)}
.regel>span{display:inline-flex;align-items:center;gap:4px}
.prijs{white-space:nowrap;font-weight:700;font-size:16px;color:var(--inkt);font-variant-numeric:tabular-nums}
.leeg{padding:60px 20px;text-align:center;color:var(--zacht)}

/* ---------- verlanglijst / heb ik ---------- */
.acties{display:inline-flex;gap:6px}
.foto .acties{position:absolute;right:8px;top:8px}
.lk{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.93);color:#40545c;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .1s,opacity .15s}
.lk:hover{transform:scale(1.1)}
.lk *{pointer-events:none}
.lk.wil.aan{background:#e03131;color:#fff}.lk.wil.aan svg{fill:#fff}
.lk.heb.aan{background:#2f9e44;color:#fff}
@media (hover:hover){   /* met een muis: knoppen pas tonen bij aanwijzen, aangevinkte blijven zichtbaar */
  .foto .lk:not(.aan){opacity:0}
  .kaart:hover .lk,.kaart:focus-within .lk{opacity:1}
}

/* ---------- tabel ---------- */
.tabelwrap{overflow-x:auto;background:var(--paneel);border:1px solid var(--rand);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--rand);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th{white-space:nowrap;font-size:12px;color:var(--zacht)}
th button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;font-weight:650;display:inline-flex;align-items:center;gap:3px}
th button.actief{color:var(--accent)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{--w:var(--avw);cursor:pointer;background:color-mix(in srgb,var(--w) var(--tint),var(--paneel))}
tbody tr.gd{--w:var(--gd)}
tbody tr td:first-child{box-shadow:inset 3px 0 var(--w)}
tbody tr:hover{background:color-mix(in srgb,var(--w) 16%,var(--paneel))}
td img.vis{width:calc(var(--kaart) * .45);aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block;background:var(--rand)}
td.winkel{white-space:nowrap;font-weight:600}
td.winkel img{width:20px;height:20px;object-fit:contain;vertical-align:-5px;margin-right:6px;background:#fff;border-radius:50%}
tr.gd td.winkel{color:var(--gd-tekst)}tr.avw td.winkel{color:var(--avw-tekst)}
td .lk{box-shadow:none;border:1px solid var(--rand)}

/* ---------- detailvenster ---------- */
dialog{border:0;border-radius:20px;padding:0;background:var(--paneel);color:var(--inkt);width:min(1100px,96vw);max-height:94vh;box-shadow:0 24px 70px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(6,14,18,.75);backdrop-filter:blur(3px)}
.dlg{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);max-height:94vh}
@media (max-width:800px){.dlg{grid-template-columns:1fr;overflow:auto}}
.dfoto{background:#05090b;display:flex;flex-direction:column;min-height:300px}
.dfoto>img{width:100%;flex:1;min-height:0;max-height:78vh;object-fit:contain}
.duimen{display:flex;gap:8px;padding:10px;overflow-x:auto}
.duimen img{width:64px;height:48px;flex:none;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.55}
.duimen img.aan{opacity:1;outline:2px solid #fff;outline-offset:-2px}
.dtekst{padding:22px 24px;overflow:auto;max-height:94vh}
.dtekst.gd{border-top:4px solid var(--gd)}.dtekst.avw{border-top:4px solid var(--avw)}
.dtekst h2{margin:0 40px 2px 0;font-size:22px;line-height:1.2;letter-spacing:-.01em}
dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:16px 0;font-size:14px}
dt{color:var(--zacht);display:flex;align-items:center;gap:7px}dd{margin:0}
.besch{white-space:pre-line;font-size:14px;color:var(--zacht);border-top:1px solid var(--rand);padding-top:14px}
.knop{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;padding:9px 16px 9px 10px;border-radius:999px;font-weight:650}
.knop.gd{background:#c2531a}.knop.avw{background:#0f6b7e}
.knop img{width:26px;height:26px;border-radius:50%;background:#fff;object-fit:contain}
.sluit,.nav{position:absolute;border:0;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;width:38px;height:38px;cursor:pointer;display:grid;place-items:center}
.sluit{right:12px;top:14px;background:var(--bg);color:var(--inkt)}
.sluit *,.nav *{pointer-events:none}
.nav{top:45%}.nav.vorige{left:10px}.nav.volgende{left:calc(60% - 58px)}
@media (max-width:800px){.nav{top:150px}.nav.volgende{left:auto;right:10px}}
.mijn{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.mijn .lk{width:auto;height:auto;border-radius:999px;padding:8px 15px 8px 11px;display:inline-flex;align-items:center;gap:6px;font:inherit;font-weight:600;box-shadow:none;border:1px solid var(--rand);background:var(--bg);color:var(--inkt)}
.mijn .lk.wil.aan{background:#e03131;border-color:#e03131;color:#fff}.mijn .lk.heb.aan{background:#2f9e44;border-color:#2f9e44;color:#fff}

/* ---------- telefoon ---------- */
@media (max-width:700px){
  body{font-size:14px}
  .breed{padding-left:12px;padding-right:12px}
  .kop{padding-top:10px;padding-bottom:10px;gap:10px}
  .logo-vis{width:36px;height:36px;border-radius:10px}
  h1{font-size:18px}
  .sub{font-size:12px}
  .meldknop{order:2;height:36px;padding:0 11px 0 9px}
  .meldknop .lang{display:none}
  .winkels{order:3;width:100%;gap:3px;padding:3px}
  .winkels button{flex:1 1 0;min-width:0;height:40px;padding:0 4px;gap:5px}
  .winkels button.alle{flex:.75 1 0;padding:0 4px}
  #logo-gd,#logo-avw{height:28px;padding:0 4px;min-width:0}
  .winkels button .gdlogo{height:24px}
  #logo-avw img{height:13px}
  .nieuws{margin-top:10px}
  .nieuws>details{padding:9px 12px}
  .nieuws summary .stil{display:none}
  .mini{width:114px}
  /* balk: alleen zoeken + Filters blijven plakken; sorteren en de rest klappen uit via "Filters" */
  .balk{margin-top:4px}
  .balk-in{padding-top:8px;padding-bottom:8px}
  .zoekveld{flex:1 1 0;min-width:0}
  input[type=search],input[type=number],select{font-size:16px}   /* voorkomt inzoomen op iPhone */
  .knopje{padding:0 12px}
  #lijstfilter{order:3;width:100%}
  #lijstfilter button{flex:1;padding:0 6px}
  .opties{display:none;order:4;width:100%;gap:8px;align-items:center}
  .balk.open .opties{display:flex}
  .opties select{flex:1 1 0;min-width:0}
  .balk.open{max-height:100dvh;overflow-y:auto}
  .paneelfilters{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
  .uitgebreid input[type=number],.uitgebreid select{width:100%}
  .vinkjes{grid-column:1/-1;gap:12px 16px}
  .formaat{display:none !important}
  .vinkjes .knopje{margin-left:0;width:100%}
  /* soorten: een rij die je opzij veegt */
  #soortmeer{width:32px;padding:0}
  #soortmeer span{display:none}
  .soorten.open .chips{max-height:45dvh;overflow-y:auto}
  /* kaarten: altijd twee naast elkaar */
  .raster{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kaart{border-radius:14px}
  .info{padding:8px 10px 10px}
  .naam{font-size:13.5px}.lat{font-size:12px}
  .regel{padding-top:7px;font-size:12px}
  .prijs{font-size:14px}

<script>

ath d=\"M4 14h6v6h-6z\" /> <path d=\"M17 17m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0\" />", "photo-off": "<path d=\"M15 8h.01\" /> <path d=\"M7 3h11a3 3 0 0 1 3 3v11m-.856 3.099a2.991 2.991 0 0 1 -2.144 .901h-12a3 3 0 0 1 -3 -3v-12c0 -.845 .349 -1.608 .91 -2.153\" /> <path d=\"M3 16l5 -5c.928 -.893 2.072 -.893 3 0l5 5\" /> <path d=\"M16.33 12.338c.574 -.054 1.155 .166 1.67 .662l3 3\" /> <path d=\"M3 3l18 18\" />", "package": "<path d=\"M12 3l8 4.5l0 9l-8 4.5l-8 -4.5l0 -9l8 -4.5\" /> <path d=\"M12 12l8 -4.5\" /> <path d=\"M12 12l0 9\" /> <path d=\"M12 12l-8 -4.5\" /> <path d=\"M16 5.25l-8 4.5\" />", "box": "<path d=\"M12 3l8 4.5l0 9l-8 4.5l-8 -4.5l0 -9l8 -4.5\" /> <path d=\"M12 12l8 -4.5\" /> <path d=\"M12 12l0 9\" /> <path d=\"M12 12l-8 -4.5\" />", "info-circle": "<path d=\"M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0\" /> <path d=\"M12 9h.01\" /> <path d=\"M11 12h1v4h1\" />", "heart": "<path d=\"M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572\" />", "adjustments-horizontal": "<path d=\"M14 6m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\" /> <path d=\"M4 6l8 0\" /> <path d=\"M16 6l4 0\" /> <path d=\"M8 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\" /> <path d=\"M4 12l2 0\" /> <path d=\"M10 12l10 0\" /> <path d=\"M17 18m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\" /> <path d=\"M4 18l11 0\" /> <path d=\"M19 18l1 0\" />", "filter-off": "<path d=\"M8 4h12v2.172a2 2 0 0 1 -.586 1.414l-3.914 3.914m-.5 3.5v4l-6 2v-8.5l-4.48 -4.928a2 2 0 0 1 -.52 -1.345v-2.227\" /> <path d=\"M3 3l18 18\" />", "list": "<path d=\"M9 6l11 0\" /> <path d=\"M9 12l11 0\" /> <path d=\"M9 18l11 0\" /> <path d=\"M5 6l0 .01\" /> <path d=\"M5 12l0 .01\" /> <path d=\"M5 18l0 .01\" />", "bell": "<path d=\"M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6\" /> <path d=\"M9 17v1a3 3 0 0 0 6 0v-1\" />", "bell-ringing": "<path d=\"M10 5a2 2 0 0 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6\" /> <path d=\"M9 17v1a3 3 0 0 0 6 0v-1\" /> <path d=\"M21 6.727a11.05 11.05 0 0 0 -2.794 -3.727\" /> <path d=\"M3 6.727a11.05 11.05 0 0 1 2.792 -3.727\" />", "chevrons-up": "<path d=\"M7 11l5 -5l5 5\" /> <path d=\"M7 17l5 -5l5 5\" />", "chevrons-down": "<path d=\"M7 7l5 5l5 -5\" /> <path d=\"M7 13l5 5l5 -5\" />"};
const ic = (naam, g = 18) => `<svg class="ic" width="${g}" height="${g}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[naam] || ""}</svg>`;
document.querySelectorAll("i[data-ic]").forEach(el => el.outerHTML = ic(el.dataset.ic, +el.dataset.g || 18));
const VISSEN = DATA.vissen;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const euro = p => p == null ? "" : "€ " + p.toFixed(2).replace(".", ",");
const kort = w => w === "G&D Aquaria" ? "gd" : "avw";
const ander = w => w === "G&D Aquaria" ? "Aquariumvissenwinkel" : "G&D Aquaria";
const icoon = w => LOGOS[kort(w) + "Icon"] ? `<img src="${LOGOS[kort(w) + "Icon"]}" alt="">` : "";

const staat = {zoek:"", winkel:"", soorten:new Set(), sorteer:"latijn", af:false, weergave:"raster",
               groepeer:true, voorraad:false, beide:false,
               lijst:"", maxLengte:null, maxPrijs:null, temp:null, ph:null, herkomst:"", diep:false};
let zichtbaar = [];

// ---- voorkeuren: bewaard in deze browser (fotoformaat, weergave, sortering, groeperen, ingeklapte groepen)
const VK = "vissenlijst.voorkeur";
const ingeklapt = new Set();
let nieuwsOpen = false, soortenOpen = false;
function bewaar() {
  try {
    localStorage.setItem(VK, JSON.stringify({formaat: +$("#formaat").value, weergave: staat.weergave, sorteer: staat.sorteer,
      af: staat.af, groepeer: staat.groepeer, ingeklapt: [...ingeklapt], nieuwsOpen, soortenOpen}));
  } catch (e) {}
}
function laadVoorkeur() {
  let v = {};
  try { v = JSON.parse(localStorage.getItem(VK) || "{}") || {}; } catch (e) {}
  if (v.formaat >= 130 && v.formaat <= 460) {
    $("#formaat").value = v.formaat; document.documentElement.style.setProperty("--kaart", v.formaat + "px");
  }
  if (["raster", "tabel"].includes(v.weergave)) {
    staat.weergave = v.weergave;
    document.querySelectorAll("#weergave button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v.weergave));
  }
  if (["latijn", "naam", "prijs", "lengte", "winkel", "soort"].includes(v.sorteer)) staat.sorteer = v.sorteer;
  if (typeof v.af === "boolean") staat.af = v.af;
  if (typeof v.groepeer === "boolean") { staat.groepeer = v.groepeer; $("#groepeer").checked = v.groepeer; }
  (Array.isArray(v.ingeklapt) ? v.ingeklapt : []).forEach(x => ingeklapt.add(String(x)));
  nieuwsOpen = v.nieuwsOpen === true; soortenOpen = v.soortenOpen === true;
}

// ---- zoekindex: zonder accenten/hoofdletters, plus afgeleide getallen voor de filters
const plat = t => String(t ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const bereik = (t, marge) => {   // "24–28 °C" -> [24, 28]; een los getal krijgt een marge eromheen
  const n = (String(t ?? "").replace(/,/g, ".").match(/\d+(\.\d+)?/g) || []).map(Number).filter(x => x < 100);
  if (!n.length) return null;
  return n.length === 1 ? [n[0] - marge, n[0] + marge] : [Math.min(...n), Math.max(...n)];
};
const WERELDDELEN = [
  ["Kweekvorm", /kweek|gedomesticeerd|hybride|gekweekt/],
  ["Midden-Amerika", /midden-amerika|mexico|costa rica|nicaragua|honduras|guatemala|belize/],
  ["Noord-Amerika", /noord-amerika|verenigde staten|florida|\busa\b/],
  ["Zuid-Amerika", /zuid-amerika|amazon|brazil|peru|colombia|venezuela|suriname|guyana|paraguay|argentin|orinoco/],
  ["Afrika", /afrika|malawi|tanganyika|victoria|congo|nigeria|kameroen/],
  ["Azië", /azie|india|thailand|china|japan|indonesi|sumatra|borneo|sri lanka|myanmar|vietnam|maleisi|taiwan|sulawesi/],
  ["Australië & Oceanië", /australi|nieuw-guinea|papoea|oceani/],
];
VISSEN.forEach(v => {
  v._zoek = plat([v.naam, v.latijn, v.titel, v.soort, v.herkomst, v.winkel, v.bak, ...Object.values(v.extra || {})].join(" "));
  v._diep = plat(v.tekst);
  v._temp = bereik(v.temp, 3);
  v._ph = bereik(v.ph, 0.5);
  const h = plat(v.herkomst);

// ---- verlanglijst / heb ik: bewaard in deze browser
const mijn = {wil: new Set(), heb: new Set()};

  const bewaard = JSON.parse(localStorage.getItem("vissenlijst.mijn") || "{}");

const LIKE = {wil: ["heart", "Wil ik", "Op mijn verlanglijst"], heb: ["circle-check", "Heb ik", "Deze heb ik"]};
function likeKnoppen(v, metTekst) {
  return `<span class="acties">` + ["wil", "heb"].map(t => {
    const aan = mijn[t].has(v.id);
    return `<button class="lk ${t}${aan ? " aan" : ""}" data-like="${t}" data-id="${esc(v.id)}" aria-pressed="${aan}" title="${LIKE[t][aan ? 2 : 1]}">${ic(LIKE[t][0], 17)}${metTekst ? LIKE[t][1] : ""}</button>`;
  }).join("") + `</span>`;
}
function wissel(knop) {
  const t = knop.dataset.like, id = knop.dataset.id;
  mijn[t].has(id) ? mijn[t].delete(id) : mijn[t].add(id);
  try { localStorage.setItem("vissenlijst.mijn", JSON.stringify({wil: [...mijn.wil], heb: [...mijn.heb]})); } catch (e) {}
  const aan = mijn[t].has(id);
  document.querySelectorAll(`.lk.${t}[data-id="${CSS.escape(id)}"]`).forEach(b => {
    b.classList.toggle("aan", aan); b.setAttribute("aria-pressed", aan); b.title = LIKE[t][aan ? 2 : 1];
  });

  if (staat.lijst) teken();   // lijst is gefilterd op verlanglijst/heb ik: opnieuw opbouwen

function tellers() {
  const bestaat = new Set(VISSEN.map(v => v.id));
  $("#n-wil").textContent = [...mijn.wil].filter(i => bestaat.has(i)).length || "";
  $("#n-heb").textContent = [...mijn.heb].filter(i => bestaat.has(i)).length || "";
}

function filter() {
  const woorden = plat(staat.zoek).split(/\s+/).filter(Boolean);
  const moet = woorden.filter(w => !w.startsWith("-")), magNiet = woorden.filter(w => w.length > 1 && w.startsWith("-")).map(w => w.slice(1));
  const tekst = v => staat.diep ? v._zoek + " " + v._diep : v._zoek;
  const binnen = (r, x) => r && x >= r[0] && x <= r[1];
  return VISSEN.filter(v =>

    (staat.temp == null || binnen(v._temp, staat.temp)) &&
    (staat.ph == null || binnen(v._ph, staat.ph)) &&

function sorteer(lijst) {

  return lijst.sort((a, b) => {

    const c = typeof x === "number" ? x - y : String(x).localeCompare(String(y), "nl");

const PUSH = /*PUSH*/null || {};
(function () {
  const knop = $("#meldknop"), hint = $("#meldhint");
  const veilig = location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname);
  if (!PUSH.worker || !PUSH.vapid || !veilig) return;   // nog niet ingesteld, of lokaal geopend bestand
  const kan = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
  const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const zeg = t => { hint.textContent = t; hint.hidden = !t; };
  const teken = aan => {
    knop.innerHTML = ic(aan ? "bell-ringing" : "bell", 17) + (aan ? "<span>Meldingen aan</span>" : '<span>Meldingen<span class="lang"> aanzetten</span></span>');
    knop.classList.toggle("aan", aan); knop.setAttribute("aria-pressed", aan);
  };
  const aanmelding = async () => {
    const reg = await navigator.serviceWorker.getRegistration();
    return reg ? reg.pushManager.getSubscription() : null;
  };
  const naarWorker = (pad, data) => fetch(PUSH.worker.replace(/\/$/, "") + pad,
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(data)});
  const sleutel = Uint8Array.from(atob(PUSH.vapid.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));

  knop.hidden = false; teken(false);
  if (kan) aanmelding().then(s => teken(!!s)).catch(() => {});
  knop.addEventListener("click", async () => {
    if (!kan) {
      return zeg(iOS
        ? "Op iPhone werkt dit alleen vanaf je beginscherm: tik in Safari op Deel en kies 'Zet op beginscherm'. Open de Vissenlijst daarna vanaf je beginscherm en tik opnieuw op deze knop."
        : "Deze browser ondersteunt geen meldingen van websites.");
    }
    knop.disabled = true;
    try {
      const bestaand = await aanmelding();
      if (bestaand) {   // uitzetten
        await naarWorker("/unsubscribe", {endpoint: bestaand.endpoint}).catch(() => {});
        await bestaand.unsubscribe();
        teken(false); zeg("Meldingen staan uit.");
      } else {          // aanzetten: hier vraagt de browser om toestemming
        if (await Notification.requestPermission() !== "granted")
          return zeg("Meldingen zijn geblokkeerd voor deze site. Zet ze aan bij de site-instellingen van je browser en probeer het opnieuw.");
        await navigator.serviceWorker.register("sw.js");
        const reg = await navigator.serviceWorker.ready;
        const nieuw = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: sleutel});
        const r = await naarWorker("/subscribe", nieuw.toJSON());
        if (!r.ok) { await nieuw.unsubscribe(); throw new Error("aanmelden mislukt (" + r.status + ")"); }
        teken(true); zeg("Meldingen staan aan. Je krijgt een bericht zodra het aanbod verandert.");
      }
    } catch (e) {
      zeg("Dat lukte niet: " + e.message);
    } finally {
      knop.disabled = false;
    }
  });
})();

$("#nieuws").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]"); if (!b) return;
  const v = VISSEN.find(x => x.id === b.dataset.id); if (!v) return;
  // Blader alleen door de vissen van dit rijtje; de hoofdlijst (zichtbaar) blijft ongemoeid.
  const rij = [...b.closest(".strook").querySelectorAll("button[data-id]")]
    .map(x => VISSEN.find(f => f.id === x.dataset.id)).filter(Boolean);
  toon(rij.indexOf(v), rij);
});
laadVoorkeur();
tekenNieuws();
tekenSoortknop();
sync();

// Was een winkel bij de laatste update niet bereikbaar, dan zijn de gegevens van die winkel ouder: laat dat zien.
(function () {
  const oud = Object.entries(DATA.winkelTijd || {}).filter(([, d]) => d && d !== DATA.opgehaald);
  if (!oud.length) return;
  $("#oud").hidden = false;
  $("#oud").textContent = oud.map(([w, d]) => `${w}: gegevens van ${mooi(d)}`).join(" · ") + " — die winkel was bij de laatste update niet bereikbaar.";
})();
$("#sub").textContent = `Bijgewerkt ${mooi(DATA.opgehaald)}`;
$("#logo-gd").innerHTML = LOGOS.gd ? `<span class="gdlogo logo"><img src="${LOGOS.gd}" alt="G&amp;D Aquaria"></span>` : "<b>G&amp;D Aquaria</b>";
$("#logo-avw").innerHTML = LOGOS.avw ? `<img src="${LOGOS.avw}" alt="Aquariumvissenwinkel">` : "<b>Aquariumvissenwinkel</b>";
const nGd = VISSEN.filter(v => v.winkel === "G&D Aquaria").length;
$("#n-alle").textContent = VISSEN.length; $("#n-gd").textContent = nGd; $("#n-avw").textContent = VISSEN.length - nGd;
teken();
</script>
</body>
</html>
